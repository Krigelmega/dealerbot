<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учёт товара и Расчёт P2P</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f4f7);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #1c1c1e);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: rgba(60, 60, 67, 0.12);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .auth-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .auth-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .auth-icon {
      font-size: 64px;
      margin-bottom: 12px;
      display: block;
    }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    .auth-subtitle {
      font-size: 14px;
      color: var(--hint-color);
      margin: 0 0 24px 0;
    }
    .auth-btn {
      width: 100%;
      height: 52px;
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: transform 0.1s ease, opacity 0.2s ease;
      margin-bottom: 12px;
    }
    .auth-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .auth-password-input {
      width: 100%;
      height: 48px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-color);
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 4px;
    }
    .auth-password-input:focus {
      border-color: var(--button-color);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    .auth-status {
      font-size: 13px;
      color: var(--hint-color);
      margin-top: 12px;
      min-height: 20px;
    }
    .auth-status.error {
      color: #ff3b30;
    }
    .auth-status.success {
      color: #34c759;
    }
    .nav-tabs {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }
    .nav-tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--hint-color);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .nav-tab.active {
      background-color: var(--button-color);
      color: var(--button-text);
      box-shadow: 0 2px 6px rgba(0, 122, 255, 0.2);
    }
    .page {
      display: none;
      flex-direction: column;
      flex: 1;
    }
    .page.active {
      display: flex;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      margin-top: 4px;
    }
    .header-icon {
      font-size: 40px;
      margin-bottom: 4px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 13px;
      color: var(--hint-color);
      margin: 4px 0 0 0;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 14px;
      position: relative;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group {
      flex: 1;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--hint-color);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    select, input {
      width: 100%;
      height: 48px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-color);
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
    }
    select:focus, input:focus {
      border-color: var(--button-color);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    .select-wrapper::after {
      content: "›";
      font-size: 22px;
      color: var(--hint-color);
      position: absolute;
      right: 16px;
      pointer-events: none;
      transform: rotate(90deg);
      font-weight: 300;
    }
    .currency-symbol {
      position: absolute;
      right: 16px;
      font-size: 16px;
      font-weight: 500;
      color: var(--hint-color);
      pointer-events: none;
    }
    .stats-row {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stats-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--hint-color);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .stats-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--button-color);
    }
    .submit-btn {
      width: 100%;
      height: 52px;
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: transform 0.1s ease, opacity 0.2s ease;
      margin-top: auto;
    }
    .submit-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .main-content {
      opacity: 0.3;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .main-content.unlocked {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <span class="auth-icon">🔑</span>
      <h2 class="auth-title">Вход в систему</h2>
      <p class="auth-subtitle">Введите код доступа</p>
      <input type="password" class="auth-password-input" id="authPassword" placeholder="Введите код" maxlength="6" inputmode="numeric">
      <button class="auth-btn" onclick="handlePasswordLogin()">Войти</button>
      <div class="auth-status" id="authStatus"></div>
    </div>
  </div>
  <div class="main-content" id="mainContent">
    <div class="nav-tabs">
      <div class="nav-tab active" onclick="switchPage(1)">Deals</div>
      <div class="nav-tab" onclick="switchPage(2)">Processing</div>
    </div>
    <div id="page1" class="page active">
      <div class="header">
        <div class="header-icon">
          <a href="https://docs.google.com/spreadsheets/d/1KmMul8xo0rvzvxRPfrCjhxJiajeN0wx9haD2q116QBw/edit?gid=0#gid=0" target="_blank" rel="noopener" style="text-decoration: none;">📦</a>
        </div>
        <h1>Учёт товара</h1>
        <p>Быстрая запись продаж</p>
      </div>
      <div class="card">
        <div class="form-group">
          <label for="count">Количество товара</label>
          <div class="input-wrapper select-wrapper">
            <select id="count" onchange="onCountChange()">
              <option value="" disabled selected>Выберите объем...</option>
              <option value="0.5">0.5 g</option>
              <option value="1">1 g</option>
              <option value="1.5">1.5 g</option>
              <option value="2">2 g</option>
              <option value="2.5">2.5 g</option>
              <option value="3">3 g</option>
              <option value="3.5">3.5 g</option>
              <option value="4">4 g</option>
              <option value="4.5">4.5 g</option>
              <option value="5">5 g</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="sum">Сумма к оплате</label>
          <div class="input-wrapper">
            <input type="number" id="sum" placeholder="0" inputmode="numeric" oninput="resetSubmitState()">
            <span class="currency-symbol">₽</span>
          </div>
        </div>
        <div class="form-group">
          <label for="comment">Комментарий</label>
          <div class="input-wrapper">
            <input type="text" id="comment" placeholder="Имя или примечание" oninput="resetSubmitState()">
          </div>
        </div>
        <div class="stats-row">
          <span class="stats-title">Записано за 24ч</span>
          <span class="stats-value" id="stats24h">0 ₽</span>
        </div>
        <div class="stats-row">
          <span class="stats-title">Прибыль за сегодня</span>
          <span class="stats-value" id="statsProfit">0 ₽</span>
        </div>
        <div class="stats-row">
          <span class="stats-title">Количество за сегодня</span>
          <span class="stats-value" id="statsCount">0 g</span>
        </div>
      </div>
      <div id="status" style="margin-bottom: 15px; font-size: 14px; text-align: center; color: #ff9500; font-weight: 600;"></div>
      <button class="submit-btn" onclick="handleButtonClick()">Сохранить запись</button>
    </div>
    <div id="page2" class="page">
      <div class="header">
        <div class="header-icon">💱</div>
        <h1>Калькулятор IKRA</h1>
        <p>Расчет спреда и комиссий</p>
      </div>
      <div class="card">
        <div class="form-row">
          <div class="form-group">
            <label for="p2pBuyRate">Курс покуп.</label>
            <div class="input-wrapper">
              <input type="number" step="0.1" id="p2pBuyRate" value="88.5" oninput="calculateP2P('buyRate')">
            </div>
          </div>
          <div class="form-group">
            <label for="p2pSellRate">Курс продаж.</label>
            <div class="input-wrapper">
              <input type="number" step="0.1" id="p2pSellRate" value="92" oninput="calculateP2P('sellRate')">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="p2pSumRub">Сумма в рублях</label>
          <div class="input-wrapper">
            <input type="number" id="p2pSumRub" placeholder="0" inputmode="numeric" oninput="calculateP2P('sumRub')">
            <span class="currency-symbol">₽</span>
          </div>
        </div>
        <div class="form-group">
          <label for="p2pSumUsdt">Сумма в USDT</label>
          <div class="input-wrapper">
            <input type="number" step="0.01" id="p2pSumUsdt" placeholder="0" inputmode="numeric" oninput="calculateP2P('sumUsdt')">
            <span class="currency-symbol">$</span>
          </div>
        </div>
        <div class="form-group">
          <label for="p2pWillSettle">Спишется</label>
          <div class="input-wrapper">
            <input type="number" step="0.01" id="p2pWillSettle" placeholder="0" oninput="calculateP2P('willSettle')">
            <span class="currency-symbol">$</span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="p2pProfit">Прибыль (6%)</label>
            <div class="input-wrapper">
              <input type="number" step="0.01" id="p2pProfit" placeholder="0" oninput="calculateP2P('profit')">
              <span class="currency-symbol">$</span>
            </div>
          </div>
          <div class="form-group">
            <label for="p2pPartner">Партнерам (1.5%)</label>
            <div class="input-wrapper">
              <input type="number" step="0.01" id="p2pPartner" placeholder="0" oninput="calculateP2P('partner')">
              <span class="currency-symbol">$</span>
            </div>
          </div>
        </div>
        <div class="form-row" style="margin-top: 14px;">
          <div class="form-group">
            <label for="p2pCourseProfit">Общая прибыль</label>
            <div class="input-wrapper">
              <input type="number" step="0.01" id="p2pCourseProfit" placeholder="0" oninput="calculateP2P('courseProfit')">
              <span class="currency-symbol">₽</span>
            </div>
          </div>
          <div class="form-group">
            <label for="p2pFinalBalance">К выводу</label>
            <div class="input-wrapper">
              <input type="number" step="0.01" id="p2pFinalBalance" placeholder="0" oninput="calculateP2P('finalBalance')">
              <span class="currency-symbol">₽</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
  const tg=window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  function rev(s){return s.split('').reverse().join('')}
  function xr(a,b){return a^b}

  // 2209 зашифрован:
  // 2209 XOR 5678 = 3471
  // 3471 + 1234 = 4705
  // 4705 * 7 = 32935
  // 32935 в base64 = "MzI5MzU="
  // Переворот строки и XOR с числом π (314) даёт код

  const enc = "MzI5MzU=";
  function getCode(){
    let a = atob(enc);           // "32935"
    a = parseInt(a);              // 32935
    a = a / 7;                    // 4705
    a = a - 1234;                 // 3471
    a = xr(a, 5678);              // 2209
    return a.toString();
  }

  const CODE = getCode();

  function unlockApp(){
    document.getElementById('authOverlay').classList.add('hidden');
    document.getElementById('mainContent').classList.add('unlocked');
    tg.HapticFeedback.notificationOccurred('success');
  }

  function handlePasswordLogin(){
    const inp=document.getElementById('authPassword');
    const st=document.getElementById('authStatus');
    const val=inp.value.trim();
    if(val===CODE){
      st.textContent='✅ Успешный вход!';
      st.className='auth-status success';
      setTimeout(unlockApp,500);
    }else{
      st.textContent='❌ Неверный код!';
      st.className='auth-status error';
      inp.value='';
      inp.focus();
      tg.HapticFeedback.notificationOccurred('error');
    }
  }

  let isSubmitted=false;
  const priceMap={"0.5":1400,"1":2500,"1.5":3750,"2":4800,"2.5":6000,"3":7200,"3.5":8200,"4":9200,"4.5":10200,"5":11200};

  function switchPage(n){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    document.getElementById('page'+n).classList.add('active');
    document.querySelectorAll('.nav-tab')[n-1].classList.add('active');
  }

  document.addEventListener('touchstart',function(e){
    if(!e.target.closest('input,select,button')){
      if(document.activeElement)document.activeElement.blur();
    }
  },{passive:true});

  document.addEventListener('click',function(e){
    if(!e.target.closest('input,select,button')){
      if(document.activeElement)document.activeElement.blur();
    }
  });

  function calculateSum(){
    const cv=document.getElementById('count').value;
    const si=document.getElementById('sum');
    if(priceMap[cv])si.value=priceMap[cv];
  }

  function onCountChange(){calculateSum();resetSubmitState();}

  function resetSubmitState(){
    if(isSubmitted){
      isSubmitted=false;
      document.querySelector('.submit-btn').innerText="Сохранить запись";
      document.getElementById('status').innerText="";
    }
  }

  function handleButtonClick(){
    if(isSubmitted){tg.close();}else{sendData();}
  }

  const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyIylzh4OES39RJ5Hed5wXvguKrCDdr517weQCqypZHe4QtUq8_I27ghGeUEvjWsBuG/exec";

  async function loadStats(){
    try{
      const cacheBuster="?t="+new Date().getTime();
      const response=await fetch(SCRIPT_URL+cacheBuster,{method:'GET',redirect:'follow'});
      const data=await response.json();
      if(data){
        if(data.total24h!==undefined)document.getElementById('stats24h').innerText=Number(data.total24h).toLocaleString('ru-RU')+' ₽';
        if(data.todayProfit!==undefined)document.getElementById('statsProfit').innerText=Number(data.todayProfit).toLocaleString('ru-RU')+' ₽';
        if(data.todayCount!==undefined)document.getElementById('statsCount').innerText=Number(data.todayCount).toLocaleString('ru-RU')+' g';
      }
    }catch(e){console.error("Ошибка загрузки статистики:",e);}
  }

  loadStats();

  async function sendData(){
    const count=document.getElementById('count').value;
    const sum=document.getElementById('sum').value;
    const comment=document.getElementById('comment').value;
    const statusDiv=document.getElementById('status');
    if(!count||!sum){
      tg.HapticFeedback.notificationOccurred('error');
      statusDiv.style.color="#ff3b30";
      statusDiv.innerText="Заполните все обязательные поля";
      return;
    }
    tg.HapticFeedback.notificationOccurred('success');
    const btn=document.querySelector('.submit-btn');
    btn.innerText="Отправка...";
    btn.disabled=true;
    statusDiv.style.color="#ff9500";
    statusDiv.innerText="Отправка запроса...";
    const countForSheet=count.toString().replace('.',',');
    const sumForSheet=sum.toString().replace('.',',');
    const params=new URLSearchParams();
    params.append("count",countForSheet);
    params.append("sum",sumForSheet);
    params.append("comment",comment);
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params});
      statusDiv.style.color="#34c759";
      statusDiv.innerText="Записано";
      btn.innerText="Закрыть";
      btn.disabled=false;
      isSubmitted=true;
      setTimeout(loadStats,1500);
    }catch(e){
      statusDiv.style.color="#ff3b30";
      statusDiv.innerText="Ошибка: "+e.message;
      btn.innerText="Сохранить запись";
      btn.disabled=false;
    }
  }

  function calculateP2P(source){
    const buyRateEl=document.getElementById('p2pBuyRate');
    const sellRateEl=document.getElementById('p2pSellRate');
    const sumRubEl=document.getElementById('p2pSumRub');
    const sumUsdtEl=document.getElementById('p2pSumUsdt');
    const willSettleEl=document.getElementById('p2pWillSettle');
    const profitEl=document.getElementById('p2pProfit');
    const partnerEl=document.getElementById('p2pPartner');
    const courseProfitEl=document.getElementById('p2pCourseProfit');
    const finalBalanceEl=document.getElementById('p2pFinalBalance');
    let buyRate=parseFloat(buyRateEl.value)||0;
    let sellRate=parseFloat(sellRateEl.value)||0;
    let sumRub=parseFloat(sumRubEl.value)||0;
    let sumUsdt=parseFloat(sumUsdtEl.value)||0;
    let willSettle=parseFloat(willSettleEl.value)||0;
    let profit=parseFloat(profitEl.value)||0;
    let partner=parseFloat(partnerEl.value)||0;
    let courseProfit=parseFloat(courseProfitEl.value)||0;
    let finalBalance=parseFloat(finalBalanceEl.value)||0;
    if(source==='sumRub'){
      sumUsdt=sellRate>0?sumRub/sellRate:0;
      sumUsdtEl.value=sumUsdt?sumUsdt.toFixed(2):'';
    }else if(source==='sumUsdt'){
      sumRub=sellRate>0?sumUsdt*sellRate:0;
      sumRubEl.value=sumRub?sumRub.toFixed(2):'';
    }else if(source==='willSettle'){
      sumUsdt=willSettle>0?willSettle/(1-0.075):0;
      sumUsdtEl.value=sumUsdt?sumUsdt.toFixed(2):'';
      sumRub=sellRate>0?sumUsdt*sellRate:0;
      sumRubEl.value=sumRub?sumRub.toFixed(2):'';
    }else if(source==='profit'){
      sumUsdt=profit>0?profit/0.06:0;
      sumUsdtEl.value=sumUsdt?sumUsdt.toFixed(2):'';
      sumRub=sellRate>0?sumUsdt*sellRate:0;
      sumRubEl.value=sumRub?sumRub.toFixed(2):'';
    }else if(source==='partner'){
      sumUsdt=partner>0?partner/0.015:0;
      sumUsdtEl.value=sumUsdt?sumUsdt.toFixed(2):'';
      sumRub=sellRate>0?sumUsdt*sellRate:0;
      sumRubEl.value=sumRub?sumRub.toFixed(2):'';
    }else if(source==='sellRate'){
      if(sumRub>0){
        sumUsdt=sellRate>0?sumRub/sellRate:0;
        sumUsdtEl.value=sumUsdt?sumUsdt.toFixed(2):'';
      }else if(sumUsdt>0){
        sumRub=sellRate>0?sumUsdt*sellRate:0;
        sumRubEl.value=sumRub?sumRub.toFixed(2):'';
      }
    }else if(source==='finalBalance'){
      finalBalance=parseFloat(finalBalanceEl.value)||0;
      sumRub=sellRate>0?finalBalance/sellRate:0;
      sumRubEl.value=sumRub?sumRub.toFixed(2):'';
      sumUsdt=sellRate>0?finalBalance/sellRate:0;
      sumUsdtEl.value=sumUsdt?sumUsdt.toFixed(2):'';
    }
    sumUsdt=parseFloat(sumUsdtEl.value)||0;
    sumRub=parseFloat(sumRubEl.value)||0;
    buyRate=parseFloat(buyRateEl.value)||0;
    sellRate=parseFloat(sellRateEl.value)||0;
    if(source!=='willSettle'){
      willSettle=sumUsdt>0?sumUsdt-(sumUsdt*0.075):0;
      willSettleEl.value=willSettle?willSettle.toFixed(2):'';
    }
    if(source!=='profit'){
      profit=sumUsdt>0?sumUsdt*0.06:0;
      profitEl.value=profit?profit.toFixed(2):'';
    }
    if(source!=='partner'){
      partner=sumUsdt>0?sumUsdt*0.015:0;
      partnerEl.value=partner?partner.toFixed(2):'';
    }
    const buyUsdtValue=(sumRub>0&&buyRate>0)?(sumRub/buyRate):0;
    const sellUsdtValue=(sumRub>0&&sellRate>0)?(sumRub/sellRate):0;
    courseProfit=(buyUsdtValue>0&&sellUsdtValue>0)?((profit*sellRate+(sumUsdt*(sellRate-buyRate)))):0;
    courseProfitEl.value=courseProfit?courseProfit.toFixed(2):'';
    if(source!=='finalBalance'){
      finalBalance=(sumUsdt>0&&sellRate>0)?(sumUsdt+(sumUsdt*0.06))*sellRate:0;
      finalBalanceEl.value=finalBalance?finalBalance.toFixed(2):'';
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('authPassword').addEventListener('keydown', function(e) {
      if(e.key==='Enter')handlePasswordLogin();
    });
    setTimeout(()=>document.getElementById('authPassword').focus(),300);
  });
  </script>
</body>
